
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哇仔｜互動式電子繪本</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans TC", sans-serif;
  background: #f8f5ed;
  color: #354b3c;
}

button {
  font: inherit;
  cursor: pointer;
}

/* ===== 首頁 ===== */

.home {
  min-height: 100vh;
  padding: 35px 20px 50px;
  text-align: center;
}

.logo {
  display: block;
  width: 150px;
  max-width: 45%;
  height: auto;
  object-fit: contain;
  margin: 10px auto 20px;
}

.home h1 {
  font-size: 27px;
  margin: 5px 0;
}

.subtitle {
  color: #888;
  margin: 10px 0 35px;
}

.books {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 25px;
  max-width: 1050px;
  margin: 0 auto;
}

/* ===== 繪本卡片 ===== */

.book-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 280px;
  max-width: 100%;
  height: auto;
  flex-shrink: 0;
  padding: 13px;
  background: #fff;
  border: none;
  border-radius: 18px;
  box-shadow: 0 5px 18px #00000012;
  text-align: center;
  color: #354b3c;
  transition: transform .2s;
}

.book-card:active {
  transform: scale(.98);
}

/* 封面專用正方形容器 */
.cover-frame {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  flex: 0 0 auto;
  overflow: hidden;
  background: #f8f5ed;
  border-radius: 12px;
}

/* 封面圖片完整顯示 */
.cover-frame img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

/* 書名 */
.book-card h2 {
  display: block;
  flex: 0 0 auto;
  font-size: 19px;
  margin: 15px 0 5px;
  line-height: 1.5;
}

/* 繪本介紹 */
.book-card p {
  display: block;
  flex: 0 0 auto;
  color: #888;
  font-size: 13px;
  margin: 0 0 8px;
  line-height: 1.5;
}

/* 開始閱讀按鈕 */
.open-btn {
  display: inline-block;
  align-self: center;
  flex: 0 0 auto;
  background: #526d59;
  color: white;
  border-radius: 25px;
  padding: 9px 25px;
  margin: 10px 0 5px;
}

/* ===== 閱讀畫面 ===== */

.reader {
  display: none;
  min-height: 100vh;
  width: 100%;
  background: #202521;
  color: white;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.reader-top {
  width: min(100%, 1100px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 0 12px;
}

.reader-top button {
  background: #ffffff20;
  color: white;
  border-radius: 20px;
  padding: 9px 16px;
  white-space: nowrap;
}

.book-title {
  font-size: 15px;
  text-align: center;
}

.stage {
  position: relative;
  width: min(100%, 1100px);
  aspect-ratio: 16 / 9;
  background: #111;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

#media {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#media video,
#media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.page-nav {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 12%;
  background: transparent;
  color: transparent;
  border: none;
  z-index: 2;
}

.page-nav.left {
  left: 0;
}

.page-nav.right {
  right: 0;
}

.page-nav:active {
  background: #ffffff12;
}

.page-info {
  margin-top: 12px;
  font-size: 13px;
  color: #ccc;
}

.message {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  background: #000b;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
  white-space: nowrap;
  max-width: 90%;
  text-align: center;
}

/* ===== 手機版 ===== */

@media (max-width: 600px) {
  .home {
    padding: 25px 18px 40px;
  }

  .books {
    gap: 20px;
  }

  .book-card {
    width: 100%;
    max-width: 340px;
  }

  /* 正方形封面寬高永遠一致 */
  .cover-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .reader {
    padding: 8px;
  }

  .reader-top button {
    padding: 8px 11px;
    font-size: 12px;
  }

  .book-title {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<!-- 首頁 -->
<section class="home" id="home">

  <img class="logo" src="logo.png.png" alt="哇仔 LOGO">

  <h1>互動式電子繪本</h1>
  <p class="subtitle">跟著哇仔一起學習防災知識！</p>

  <div class="books">

    <!-- 地震篇 -->
    <button class="book-card" onclick="openBook('earthquake')">
      <div class="cover-frame">
        <img src="earthquake/cover.jpg.jpg" alt="地震篇封面">
      </div>
      <h2>地震篇</h2>
      <p>搖搖晃晃我不慌</p>
      <span class="open-btn">開始閱讀</span>
    </button>

    <!-- 火災篇 -->
    <button class="book-card" onclick="openBook('fire')">
      <div class="cover-frame">
        <img src="fire/cover.jpg.jpg" alt="火災篇封面">
      </div>
      <h2>火災篇</h2>
      <p>有霧有煙 我不亂</p>
      <span class="open-btn">開始閱讀</span>
    </button>

    <!-- 颱風篇 -->
    <button class="book-card" onclick="openBook('typhoon')">
      <div class="cover-frame">
        <img src="typhoon/cover.jpg.jpg" alt="颱風篇封面">
      </div>
      <h2>颱風篇</h2>
      <p>風大雨大 我不怕</p>
      <span class="open-btn">開始閱讀</span>
    </button>

  </div>
</section>

<!-- 繪本閱讀畫面 -->
<section class="reader" id="reader">

  <div class="reader-top">
    <button onclick="goHome()">← 返回首頁</button>
    <div class="book-title" id="bookTitle"></div>
    <button onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>

  <div class="stage" id="stage">

    <div id="media"></div>

    <button class="page-nav left"
      onclick="changePage(-1)"
      aria-label="上一頁"></button>

    <button class="page-nav right"
      onclick="changePage(1)"
      aria-label="下一頁"></button>

    <div class="message" id="message"></div>

  </div>

  <div class="page-info" id="pageInfo"></div>

</section>

<script>

const books = {
  earthquake: {
    title: "地震篇｜搖搖晃晃我不慌",
    folder: "earthquake"
  },
  fire: {
    title: "火災篇｜有霧有煙 我不亂",
    folder: "fire"
  },
  typhoon: {
    title: "颱風篇｜風大雨大 我不怕",
    folder: "typhoon"
  }
};

let currentBook = null;
let currentPage = 0;
let pages = [];

const home = document.getElementById("home");
const reader = document.getElementById("reader");
const media = document.getElementById("media");
const stage = document.getElementById("stage");
const pageInfo = document.getElementById("pageInfo");
const bookTitle = document.getElementById("bookTitle");
const message = document.getElementById("message");

/* 建立繪本頁面清單 */
function makePages(folder) {

  const result = [];

  result.push({
    type: "video",
    src: `${folder}/cover.mp4.mp4`
  });

  for (let i = 1; i <= 15; i++) {
    result.push({
      type: "video",
      src: `${folder}/page${i}.mp4.mp4`
    });
  }

  result.push({
    type: "image",
    src: `${folder}/page16.jpg.jpg`
  });

  result.push({
    type: "video",
    src: `${folder}/backcover.mp4.mp4`
  });

  return result;
}

/* 開啟繪本 */
function openBook(bookKey) {

  currentBook = books[bookKey];
  currentPage = 0;
  pages = makePages(currentBook.folder);

  home.style.display = "none";
  reader.style.display = "flex";

  bookTitle.textContent = currentBook.title;

  renderPage();
}

/* 顯示目前頁面 */
function renderPage() {

  media.innerHTML = "";
  message.style.display = "none";

  const page = pages[currentPage];

  pageInfo.textContent =
    `第 ${currentPage + 1} / ${pages.length} 頁`;

  if (page.type === "video") {

    const video = document.createElement("video");

    video.src = page.src;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.controls = false;
    video.loop = false;

    video.addEventListener("error", () => {
      showMessage("影片載入失敗，請檢查檔案名稱");
    });

    video.addEventListener("click", (event) => {

      event.stopPropagation();

      if (video.paused) {
        video.play().catch(() => {
          showMessage("影片無法播放，請再點一次");
        });
      } else {
        video.pause();
      }

    });

    media.appendChild(video);

    video.play().catch(() => {
      showMessage("如果影片沒有自動播放，請點擊影片");
    });

  } else {

    const img = document.createElement("img");

    img.src = page.src;
    img.alt = "繪本版權頁";

    img.addEventListener("error", () => {
      showMessage("圖片載入失敗，請檢查檔案名稱");
    });

    media.appendChild(img);
  }
}

/* 顯示提示 */
function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

/* 左右翻頁 */
function changePage(direction) {

  const next = currentPage + direction;

  if (next < 0 || next >= pages.length) {
    return;
  }

  currentPage = next;
  renderPage();
}

/* 返回首頁 */
function goHome() {

  const video = media.querySelector("video");

  if (video) {
    video.pause();
  }

  media.innerHTML = "";

  reader.style.display = "none";
  home.style.display = "block";
}

/* 全螢幕 */
async function toggleFullscreen() {

  try {

    if (!document.fullscreenElement) {
      await reader.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

  } catch (error) {
    showMessage("目前瀏覽器不支援全螢幕");
  }
}

/* 手機左右滑動翻頁 */
let touchStartX = 0;
let touchStartY = 0;

stage.addEventListener("touchstart", (event) => {

  touchStartX = event.changedTouches[0].screenX;
  touchStartY = event.changedTouches[0].screenY;

}, { passive: true });

stage.addEventListener("touchend", (event) => {

  const endX = event.changedTouches[0].screenX;
  const endY = event.changedTouches[0].screenY;

  const diffX = endX - touchStartX;
  const diffY = endY - touchStartY;

  if (
    Math.abs(diffX) > 50 &&
    Math.abs(diffX) > Math.abs(diffY)
  ) {
    changePage(diffX < 0 ? 1 : -1);
  }

}, { passive: true });

/* 電腦鍵盤左右鍵翻頁 */
document.addEventListener("keydown", (event) => {

  if (reader.style.display !== "flex") return;

  if (event.key === "ArrowRight") {
    changePage(1);
  }

  if (event.key === "ArrowLeft") {
    changePage(-1);
  }

  if (
    event.key === "Escape" &&
    !document.fullscreenElement
  ) {
    goHome();
  }

});

</script>

</body>
</html>
