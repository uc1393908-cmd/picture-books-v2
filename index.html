
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哇仔｜互動式電子繪本</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans TC", sans-serif;
  background: #f8f5ed;
  color: #354b3c;
}

button {
  font: inherit;
  cursor: pointer;
}

/* ===== 首頁 ===== */

.home {
  min-height: 100vh;
  padding: 35px 20px 50px;
  text-align: center;
}

.logo {
  display: block;
  width: 150px;
  max-width: 45%;
  height: auto;
  object-fit: contain;
  margin: 10px auto 20px;
}

.home h1 {
  font-size: 27px;
  margin: 5px 0;
}

.subtitle {
  color: #888;
  margin: 10px 0 35px;
}

.books {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 25px;
  max-width: 1050px;
  margin: 0 auto;
}

/* ===== 繪本卡片 ===== */

.book-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 280px;
  max-width: 100%;
  height: auto;
  flex-shrink: 0;
  padding: 13px;
  background: #fff;
  border: none;
  border-radius: 18px;
  box-shadow: 0 5px 18px #00000012;
  text-align: center;
  color: #354b3c;
  transition: transform .2s;
}

.book-card:active {
  transform: scale(.98);
}

.cover-frame {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  flex: 0 0 auto;
  overflow: hidden;
  background: #f8f5ed;
  border-radius: 12px;
}

.cover-frame img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.book-card h2 {
  display: block;
  flex: 0 0 auto;
  font-size: 19px;
  margin: 15px 0 5px;
  line-height: 1.5;
}

.book-card p {
  display: block;
  flex: 0 0 auto;
  color: #888;
  font-size: 13px;
  margin: 0 0 8px;
  line-height: 1.5;
}

.open-btn {
  display: inline-block;
  align-self: center;
  flex: 0 0 auto;
  background: #526d59;
  color: white;
  border-radius: 25px;
  padding: 9px 25px;
  margin: 10px 0 5px;
}

/* ===== 閱讀畫面 ===== */

.reader {
  display: none;
  min-height: 100vh;
  width: 100%;
  background: #202521;
  color: white;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.reader-top {
  width: min(100%, 1100px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 0 12px;
}

.reader-top button {
  background: #ffffff20;
  color: white;
  border-radius: 20px;
  padding: 9px 16px;
  white-space: nowrap;
  border: none;
}

.book-title {
  font-size: 15px;
  text-align: center;
}

.stage {
  position: relative;
  width: min(100%, 1100px);
  aspect-ratio: 16 / 9;
  background: #111;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

#media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#media video,
#media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.page-nav {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 12%;
  background: transparent;
  color: transparent;
  border: none;
  z-index: 2;
}

.page-nav.left {
  left: 0;
}

.page-nav.right {
  right: 0;
}

.page-nav:active {
  background: #ffffff12;
}

.page-info {
  margin-top: 12px;
  font-size: 13px;
  color: #ccc;
}

.message {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);
  background: #000b;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
  white-space: nowrap;
  max-width: 90%;
  text-align: center;
}

/* 載入提示 */

.loading {
  position: absolute;
  z-index: 4;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  background: #202521;
  color: white;
  font-size: 14px;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #ffffff40;
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ===== 手機版 ===== */

@media (max-width: 600px) {
  .home {
    padding: 25px 18px 40px;
  }

  .books {
    gap: 20px;
  }

  .book-card {
    width: 100%;
    max-width: 340px;
  }

  .cover-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .reader {
    padding: 8px;
  }

  .reader-top button {
    padding: 8px 11px;
    font-size: 12px;
  }

  .book-title {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<!-- 首頁 -->
<section class="home" id="home">

  <img class="logo" src="logo.png.png" alt="哇仔 LOGO">

  <h1>互動式電子繪本</h1>
  <p class="subtitle">跟著哇仔一起學習防災知識！</p>

  <div class="books">

    <button class="book-card" onclick="openBook('earthquake')">
      <div class="cover-frame">
        <img src="earthquake/cover.jpg.jpg" alt="地震篇封面">
      </div>
      <h2>地震篇</h2>
      <p>搖搖晃晃我不慌</p>
      <span class="open-btn">開始閱讀</span>
    </button>

    <button class="book-card" onclick="openBook('fire')">
      <div class="cover-frame">
        <img src="fire/cover.jpg.jpg" alt="火災篇封面">
      </div>
      <h2>火災篇</h2>
      <p>有霧有煙 我不亂</p>
      <span class="open-btn">開始閱讀</span>
    </button>

    <button class="book-card" onclick="openBook('typhoon')">
      <div class="cover-frame">
        <img src="typhoon/cover.jpg.jpg" alt="颱風篇封面">
      </div>
      <h2>颱風篇</h2>
      <p>風大雨大 我不怕</p>
      <span class="open-btn">開始閱讀</span>
    </button>

  </div>
</section>

<!-- 繪本閱讀畫面 -->
<section class="reader" id="reader">

  <div class="reader-top">
    <button onclick="goHome()">← 返回首頁</button>
    <div class="book-title" id="bookTitle"></div>
    <button onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>

  <div class="stage" id="stage">

    <div id="media"></div>

    <button class="page-nav left"
      onclick="changePage(-1)"
      aria-label="上一頁"></button>

    <button class="page-nav right"
      onclick="changePage(1)"
      aria-label="下一頁"></button>

    <div class="message" id="message"></div>

    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <span>繪本載入中，請稍候...</span>
    </div>

  </div>

  <div class="page-info" id="pageInfo"></div>

</section>

<script>

const books = {
  earthquake: {
    title: "地震篇｜搖搖晃晃我不慌",
    folder: "earthquake"
  },
  fire: {
    title: "火災篇｜有霧有煙 我不亂",
    folder: "fire"
  },
  typhoon: {
    title: "颱風篇｜風大雨大 我不怕",
    folder: "typhoon"
  }
};

let currentBook = null;
let currentBookKey = null;
let currentPage = 0;
let requestedPage = 0;
let pages = [];
let renderToken = 0;

const videoCache = new Map();
const imageCache = new Map();

const home = document.getElementById("home");
const reader = document.getElementById("reader");
const media = document.getElementById("media");
const stage = document.getElementById("stage");
const pageInfo = document.getElementById("pageInfo");
const bookTitle = document.getElementById("bookTitle");
const message = document.getElementById("message");
const loading = document.getElementById("loading");

/* ===== 建立繪本頁面清單 ===== */

function makePages(folder) {

  const result = [];

  result.push({
    type: "video",
    src: `${folder}/cover.mp4.mp4`
  });

  for (let i = 1; i <= 15; i++) {
    result.push({
      type: "video",
      src: `${folder}/page${i}.mp4.mp4`
    });
  }

  result.push({
    type: "image",
    src: `${folder}/page16.jpg.jpg`
  });

  result.push({
    type: "video",
    src: `${folder}/backcover.mp4.mp4`
  });

  return result;
}

/* ===== 判斷是否為颱風篇封底 ===== */

function isSilentPage(bookKey, page) {
  return (
    bookKey === "typhoon" &&
    page.src === "typhoon/backcover.mp4.mp4"
  );
}

/* ===== 預先準備影片 ===== */

function prepareVideo(src, silent = false) {

  if (videoCache.has(src)) {
    return videoCache.get(src).promise;
  }

  const video = document.createElement("video");

  video.preload = "auto";
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.controls = false;
  video.loop = false;

  video.muted = silent;
  video.defaultMuted = silent;
  video.volume = silent ? 0 : 1;

  if (silent) {
    video.setAttribute("muted", "");
  }

  const promise = new Promise((resolve, reject) => {

    if (video.readyState >= 2) {
      resolve(video);
      return;
    }

    const onReady = () => {
      cleanup();
      resolve(video);
    };

    const onError = () => {
      cleanup();
      reject(new Error("影片載入失敗：" + src));
    };

    const cleanup = () => {
      video.removeEventListener("loadeddata", onReady);
      video.removeEventListener("error", onError);
    };

    video.addEventListener("loadeddata", onReady);
    video.addEventListener("error", onError);

    video.src = src;
    video.load();

  });

  videoCache.set(src, {
    video,
    promise
  });

  return promise;
}

/* ===== 預先準備圖片 ===== */

function prepareImage(src) {

  if (imageCache.has(src)) {
    return imageCache.get(src);
  }

  const promise = new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("圖片載入失敗：" + src));

    img.src = src;

  });

  imageCache.set(src, promise);

  return promise;
}

/* ===== 首頁預載三本封面 ===== */

function preloadHomeCovers() {

  Object.values(books).forEach((book) => {

    prepareVideo(`${book.folder}/cover.mp4.mp4`)
      .catch(() => {});

  });

}

/* ===== 預載目前頁面的前後頁 ===== */

function preloadNearbyPages(index) {

  const nearbyIndexes = [
    index - 1,
    index + 1
  ];

  nearbyIndexes.forEach((nearbyIndex) => {

    if (
      nearbyIndex < 0 ||
      nearbyIndex >= pages.length
    ) {
      return;
    }

    const page = pages[nearbyIndex];

    if (page.type === "video") {

      prepareVideo(
        page.src,
        isSilentPage(currentBookKey, page)
      ).catch(() => {});

    } else {

      prepareImage(page.src).catch(() => {});

    }

  });

}

/* ===== 開啟繪本 ===== */

function openBook(bookKey) {

  currentBookKey = bookKey;
  currentBook = books[bookKey];

  currentPage = 0;
  requestedPage = 0;
  pages = makePages(currentBook.folder);

  renderToken++;

  home.style.display = "none";
  reader.style.display = "flex";

  bookTitle.textContent = currentBook.title;

  media.innerHTML = "";
  loading.style.display = "flex";

  pageInfo.textContent = "";

  renderPage(0);
}

/* ===== 顯示頁面 ===== */

async function renderPage(index) {

  const myToken = ++renderToken;
  const page = pages[index];

  if (!page) return;

  message.style.display = "none";
  loading.style.display = "flex";

  try {

    let newElement;

    if (page.type === "video") {

      const video = await prepareVideo(
        page.src,
        isSilentPage(currentBookKey, page)
      );

      newElement = video;

    } else {

      const img = await prepareImage(page.src);

      newElement = img;

    }

    /* 如果等待期間使用者又翻頁，就不顯示舊請求 */
    if (myToken !== renderToken) {
      return;
    }

    /* 保留上一頁直到新頁面準備完成 */
    const oldVideo = media.querySelector("video");

    if (oldVideo) {

      oldVideo.pause();

      /* 把上一頁影片放回快取 */
      const oldSrc = oldVideo.getAttribute("src");

      if (oldSrc) {
        videoCache.set(oldSrc, {
          video: oldVideo,
          promise: Promise.resolve(oldVideo)
        });
      }

    }

    /* 切換畫面 */
    media.innerHTML = "";

    if (page.type === "video") {

      /* 重新確認颱風篇封底靜音 */
      const silent = isSilentPage(currentBookKey, page);

      newElement.muted = silent;
      newElement.defaultMuted = silent;
      newElement.volume = silent ? 0 : 1;

      if (silent) {
        newElement.setAttribute("muted", "");
      } else {
        newElement.removeAttribute("muted");
      }

      newElement.currentTime = 0;

      media.appendChild(newElement);

      newElement.play().catch(() => {
        showMessage("如果影片沒有自動播放，請點擊影片");
      });

    } else {

      newElement.alt = "繪本版權頁";
      media.appendChild(newElement);

    }

    currentPage = index;
    requestedPage = index;

    pageInfo.textContent =
      `第 ${currentPage + 1} / ${pages.length} 頁`;

    loading.style.display = "none";

    /* 背景預載前後頁 */
    preloadNearbyPages(currentPage);

  } catch (error) {

    if (myToken !== renderToken) return;

    loading.style.display = "none";
    requestedPage = currentPage;

    showMessage("載入失敗，請檢查網路或檔案名稱");

    console.error(error);

  }

}

/* ===== 顯示提示 ===== */

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
}

/* ===== 左右翻頁 ===== */

function changePage(direction) {

  const next = requestedPage + direction;

  if (next < 0 || next >= pages.length) {
    return;
  }

  if (next === requestedPage) {
    return;
  }

  requestedPage = next;

  renderPage(next);
}

/* ===== 返回首頁 ===== */

function goHome() {

  renderToken++;

  const video = media.querySelector("video");

  if (video) {
    video.pause();
  }

  media.innerHTML = "";

  loading.style.display = "none";
  message.style.display = "none";

  reader.style.display = "none";
  home.style.display = "block";

  currentBook = null;
  currentBookKey = null;
  currentPage = 0;
  requestedPage = 0;
  pages = [];

}

/* ===== 全螢幕 ===== */

async function toggleFullscreen() {

  try {

    if (!document.fullscreenElement) {
      await reader.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

  } catch (error) {
    showMessage("目前瀏覽器不支援全螢幕");
  }

}

/* ===== 手機左右滑動翻頁 ===== */

let touchStartX = 0;
let touchStartY = 0;

stage.addEventListener("touchstart", (event) => {

  touchStartX = event.changedTouches[0].screenX;
  touchStartY = event.changedTouches[0].screenY;

}, { passive: true });

stage.addEventListener("touchend", (event) => {

  const endX = event.changedTouches[0].screenX;
  const endY = event.changedTouches[0].screenY;

  const diffX = endX - touchStartX;
  const diffY = endY - touchStartY;

  if (
    Math.abs(diffX) > 50 &&
    Math.abs(diffX) > Math.abs(diffY)
  ) {

    changePage(diffX < 0 ? 1 : -1);

  }

}, { passive: true });

/* ===== 電腦鍵盤左右鍵翻頁 ===== */

document.addEventListener("keydown", (event) => {

  if (reader.style.display !== "flex") return;

  if (event.key === "ArrowRight") {
    changePage(1);
  }

  if (event.key === "ArrowLeft") {
    changePage(-1);
  }

  if (
    event.key === "Escape" &&
    !document.fullscreenElement
  ) {
    goHome();
  }

});

/* ===== 網站開啟後，預載三本封面 ===== */

preloadHomeCovers();

</script>

</body>
</html>
